<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c2e20" />
    <meta
      name="description"
      content="Rashko Restaurant: Yemeni, Arabic and Middle Eastern cuisine in Kano. Mandi, Kabuli, BBQ chicken, fresh juices and more."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font load: the page paints immediately even if Google Fonts is slow or blocked. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:wght@400;500;600;700&display=swap"
      />
    </noscript>
    <title>Rashko Restaurant | Yemeni &amp; Arabian Cuisine in Kano</title>
  </head>
  <body style="margin:0">
    <div id="root">
      <!-- Shown until the app starts. If you only ever see this, the JavaScript did not load: check the browser console (F12). -->
      <div style="min-height:100vh;display:grid;place-items:center;background:#0c2e20">
        <div style="width:160px;height:160px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden">
          <img src="/logo.png" alt="Rashko Restaurant" width="112" height="130" style="width:112px;height:auto" />
        </div>
      </div>
    </div>
    <noscript>This website needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
